# configs/baseline.yaml
model_name: "meta-llama/Llama-3.2-1B"
lora_rank: 32
epochs: 1

# Training parameters
learning_rate: 0.0004908239409722158
batch_size: 32           
max_length: 16384        

# --- THE DRY RUN LIMITER ---
max_steps: 15            # Stops training completely after 15 batches. 

# Checkpointing and Evaluation
save_steps: 15           # Set this to match max_steps so it saves at the very end
log_steps: 5             # Log frequently so you can see it working quickly
eval_every: 0            # Disable evaluation just for the dry run to save time

# Dataset settings
dataset_name: "tulu3"